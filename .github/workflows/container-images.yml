name: Container images

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/container-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-images-${{ github.ref }}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Sign in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish both images
        run: |
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          for service in backend frontend; do
            image="$image_prefix-$service"
            docker buildx build --push \
              --platform linux/amd64,linux/arm64 \
              --tag "$image:sha-$GITHUB_SHA" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              "./$service"
          done

          for service in backend frontend; do
            image="$image_prefix-$service"
            docker buildx imagetools create --tag "$image:main" "$image:sha-$GITHUB_SHA"
          done
