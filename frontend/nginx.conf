# Same-origin GET requests may omit Origin. Keep any Origin the browser sent.
map "$http_origin:$http_sec_fetch_site" $nobel_api_origin {
    default $http_origin;
    ":same-origin" "$scheme://$http_host";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $nobel_api_origin;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
