<main class="stage-page">
  <header class="stage-header">
    <nav class="stage-nav" aria-label="Sahne menüsü">
      <a routerLink="/live-stage" aria-current="page">Canlı Sahne</a>
      <a routerLink="/dinamik-senaryolar">Dinamik Senaryolar</a>
    </nav>
    <span class="connection" role="status" [attr.data-status]="stream.status()">
      {{ statusLabel(stream.status()) }}
    </span>
  </header>
  <h1>Nobel Canlı Sahne</h1>
  <div class="stage-grid">
    <section class="surface map-panel" aria-labelledby="er-heading">
      <h2 id="er-heading">ER Diyagramı</h2>
      <app-er-live-map [highlight]="current()?.erHighlight ?? null" />
    </section>
    <section class="surface character-panel" aria-labelledby="character-heading">
      <h2 id="character-heading">Karakter Sahnesi</h2>
      <app-character-stage />
    </section>
  </div>
  <section class="surface ribbon" aria-labelledby="sql-heading">
    <h2 id="sql-heading">SQL Akışı</h2>
    <app-sql-ribbon />
  </section>
  @if (demo()) {
    <section class="surface" aria-labelledby="demo-heading">
      <h2 id="demo-heading">Demo olaylar</h2>
      <div class="demo-actions">
        @for (fixture of fixtures; track fixture.action) {
          <button type="button" (click)="play(fixture)">{{ fixture.label }}</button>
        }
      </div>
    </section>
  }
</main>
