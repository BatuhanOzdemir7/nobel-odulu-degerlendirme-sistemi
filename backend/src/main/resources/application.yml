spring:
  application:
    name: nobel-degerlendirme
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nobel_db}
    username: ${DB_USERNAME:nobel_user}
    password: ${DB_PASSWORD:nobel_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080
springdoc:
  swagger-ui:
    path: /swagger-ui.html
