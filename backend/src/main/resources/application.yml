spring:
  application:
    name: nobel-degerlendirme
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nobel_db}
    username: ${DB_USERNAME:nobel_user}
    password: ${DB_PASSWORD:nobel_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Faz 2B'deki V4, Faz 2A'da uygulanmış V5'in ardından çalışabilmeli.
    out-of-order: true
nobel:
  time-zone: Europe/Istanbul
  evaluation:
    quorum: 3
  security:
    jwt:
      secret: ${NOBEL_JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
      expiration: PT8H
server:
  port: 8080
springdoc:
  swagger-ui:
    path: /swagger-ui.html
