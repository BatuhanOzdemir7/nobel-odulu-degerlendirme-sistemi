services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nobel_db
      POSTGRES_USER: "${NOBEL_DB_USERNAME:-nobel_username}"
      POSTGRES_PASSWORD: "${NOBEL_DB_PASSWORD:-nobel_password}"
    ports:
      - "127.0.0.1:${NOBEL_DB_PORT:-0}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: "${NOBEL_IMAGE_REPOSITORY:-ghcr.io/batuhanozdemir7/nobel-odulu-degerlendirme-sistemi}-backend:${NOBEL_IMAGE_TAG:-main}"
    pull_policy: missing
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/nobel_db
      DB_USERNAME: "${NOBEL_DB_USERNAME:-nobel_username}"
      DB_PASSWORD: "${NOBEL_DB_PASSWORD:-nobel_password}"
      SERVER_ADDRESS: 127.0.0.1
      NOBEL_LOCAL_DEMO_LOGIN: "${NOBEL_LOCAL_DEMO_LOGIN:-true}"
      NOBEL_LOCAL_DEMO_PORT: "${NOBEL_APP_PORT:-4200}"
    depends_on:
      postgres:
        condition: service_healthy
    # Nginx shares this network namespace so Spring can stay on loopback.
    ports:
      - "127.0.0.1:${NOBEL_APP_PORT:-4200}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/events/recent"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  frontend:
    image: "${NOBEL_IMAGE_REPOSITORY:-ghcr.io/batuhanozdemir7/nobel-odulu-degerlendirme-sistemi}-frontend:${NOBEL_IMAGE_TAG:-main}"
    pull_policy: missing
    build: ./frontend
    restart: unless-stopped
    network_mode: service:backend
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/login"]
      interval: 5s
      timeout: 3s
      retries: 6

volumes:
  postgres_data:
