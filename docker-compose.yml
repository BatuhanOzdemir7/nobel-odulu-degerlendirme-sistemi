services:
  postgres:
    image: postgres:16-alpine
    container_name: nobel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nobel_db
      POSTGRES_USER: nobel_user
      POSTGRES_PASSWORD: nobel_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nobel_user -d nobel_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
